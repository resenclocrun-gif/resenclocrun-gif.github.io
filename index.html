<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología de los Últimos Días - JW.org</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 5px;
        }

        .tab-button {
            background: none;
            border: none;
            color: white;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab-button.active {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .tab-button:hover {
            background: rgba(255,255,255,0.15);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timeline-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            transform: scale(1.02);
        }

        .timeline-item.left {
            padding-right: calc(50% + 30px);
            text-align: right;
        }

        .timeline-item.right {
            padding-left: calc(50% + 30px);
            text-align: left;
        }

        .timeline-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .timeline-item.established .timeline-content {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .timeline-item.future .timeline-content {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
        }

        .timeline-content h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .timeline-content .year {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .timeline-dot {
            position: absolute;
            top: 20px;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .timeline-item.left .timeline-dot {
            right: calc(50% - 10px);
        }

        .timeline-item.right .timeline-dot {
            left: calc(50% - 10px);
        }

        .concept-map {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .concept-node {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 25px;
            margin: 10px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .concept-node:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .concept-node.central {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .question {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #333;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .quiz-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quiz-option.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .quiz-option.incorrect {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .quiz-feedback {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .quiz-feedback.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .quiz-feedback.correct {
            background: rgba(56, 239, 125, 0.1);
            color: #11998e;
            border: 2px solid #38ef7d;
        }

        .quiz-feedback.incorrect {
            background: rgba(255, 107, 107, 0.1);
            color: #ee5a6f;
            border: 2px solid #ff6b6b;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 5px;
            transition: width 1s ease;
            width: 0%;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .legend-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }

        .legend-dot.established {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .legend-dot.future {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: #333;
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }

            .timeline-item {
                padding-left: 50px !important;
                padding-right: 0 !important;
                text-align: left !important;
            }

            .timeline-dot {
                left: 10px !important;
                right: auto !important;
            }

            .nav-tabs {
                flex-direction: column;
                border-radius: 15px;
            }

            .tab-button {
                border-radius: 10px;
                margin: 2px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ Cronología de los Últimos Días</h1>
            <p>Según las Fuentes de JW.org - Comprensión Visual e Interactiva</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-button active" onclick="showTab('timeline')">📅 Línea de Tiempo</button>
            <button class="tab-button" onclick="showTab('conceptmap')">🗺️ Mapa Conceptual</button>
            <button class="tab-button" onclick="showTab('quiz')">❓ Preguntas</button>
        </div>

        <!-- Timeline Tab -->
        <div id="timeline" class="tab-content active">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot established"></div>
                    <span>Acontecimientos Establecidos</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot future"></div>
                    <span>Acontecimientos Futuros</span>
                </div>
            </div>
            
            <div class="timeline-container">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Cronología Completa</h2>
                <div class="timeline" id="mainTimeline">
                    <!-- Timeline items will be populated by JavaScript -->
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p style="text-align: center; color: white; margin-top: 10px;">
                Progreso en la Cronología de los Últimos Días
            </p>
        </div>

        <!-- Concept Map Tab -->
        <div id="conceptmap" class="tab-content">
            <div class="concept-map">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Mapa Conceptual de los Últimos Días</h2>
                <div id="conceptMapContainer">
                    <!-- Concept map will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Quiz Tab -->
        <div id="quiz" class="tab-content">
            <div class="quiz-container">
                <h2 style="margin-bottom: 30px; color: #333;">Preguntas sobre la Cronología</h2>
                <div id="quizContainer">
                    <!-- Quiz will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for detailed information -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const timelineData = [

            {

                description: "Los Estudiantes de la Biblia son identificados como cristianos verdaderos",
                category: "established",
                details: "Inicio del período de recoger el trigo, separación de Babilonia la Grande, intensificación de la obra de predicación."
            },
            {
                year: "1920-1945",
                title: "Formación del 'Octavo Rey'",
                description: "Creación de la Sociedad de Naciones y posteriormente las Naciones Unidas",
                category: "established",
                details: "1920: Sociedad de Naciones, 1945: Naciones Unidas - Cumplimiento de la profecía del 'octavo rey'."
            },
            {
                year: "Futuro Inmediato",
                title: "Proclamación de 'Paz y Seguridad'",
                description: "Los líderes mundiales proclamarán una falsa paz",
                category: "future",
                details: "Esta proclamación marcará el inicio inminente del 'día de Jehová' y será una señal clave para los eventos finales."
            },
            {
                year: "Después de 'Paz y Seguridad'",
                title: "Transferencia de Poder a la ONU",
                description: "Los gobiernos entregan súbitamente su autoridad a las Naciones Unidas",
                category: "future",
                details: "NUEVA COMPRENSIÓN: Este será un evento súbito y dramático que señalará que la gran tribulación está a punto de empezar."
            },
            {
                year: "Gran Tribulación - Inicio",
                title: "Destrucción de Babilonia la Grande",
                description: "La ONU destruye todas las religiones falsas",
                category: "future",
                details: "Marca el inicio oficial de la gran tribulación. Las Naciones Unidas, con su nueva autoridad, ejecutan la sentencia divina contra las religiones falsas."
            },
            {
                year: "Durante la Gran Tribulación",
                title: "Recolección Final de Ungidos",
                description: "Los 144,000 ungidos restantes son reunidos en el cielo",
                category: "future",
                details: "Todos los ungidos restantes reciben su recompensa celestial antes del Armagedón. Jesús actúa como Juez y comienza el juicio de ovejas y cabras."
            },
            {
                year: "Final de la Gran Tribulación",
                title: "Ataque de Gog de Magog",
                description: "Coalición liderada por Rusia ataca a los siervos de Dios",
                category: "future",
                details: "Después de la destrucción de las religiones falsas, los Testigos de Jehová quedan como único grupo religioso visible y son atacados."
            },
            {
                year: "Armagedón",
                title: "Guerra del Armagedón",
                description: "Jesucristo y sus ejércitos celestiales intervienen",
                category: "future",
                details: "Intervención divina con terremotos, granizo, rayos y confusión entre enemigos. Los 144,000 desde el cielo participan en la batalla."
            },
            {
                year: "Después del Armagedón",
                title: "Las Bodas del Cordero",
                description: "Celebración celestial de la unión completa del Reino",
                category: "future",
                details: "Celebración de la unión de Cristo con sus 144,000 co-gobernantes en el cielo."
            },
            {
                year: "Reino Milenario",
                title: "Confinamiento de Satanás",
                description: "Satanás es arrojado al abismo por 1,000 años",
                category: "future",
                details: "Inicio del Reinado Milenario de Cristo en la Tierra, con Satanás y los demonios inactivos."
            }
        ];

        const conceptMapData = [
            { id: 'reino', text: '1914 - Reino de Dios', type: 'central', x: 50, y: 20 },
            { id: 'senal', text: 'Señal de la Presencia', type: 'normal', x: 20, y: 40 },
            { id: 'inspeccion', text: 'Inspección del Templo', type: 'normal', x: 80, y: 40 },
            { id: 'trigo', text: '1919 - Identificación del Trigo', type: 'normal', x: 50, y: 60 },
            { id: 'paz', text: 'Proclamación Paz y Seguridad', type: 'future', x: 30, y: 80 },
            { id: 'onu', text: 'Transferencia Poder a ONU', type: 'future', x: 70, y: 80 },
            { id: 'babilonia', text: 'Destrucción Babilonia', type: 'future', x: 20, y: 100 },
            { id: 'gog', text: 'Ataque de Gog', type: 'future', x: 50, y: 120 },
            { id: 'armagedon', text: 'Armagedón', type: 'future', x: 80, y: 100 }
        ];

        const quizData = [
            {
                question: "¿En qué año se estableció el Reino de Dios según JW.org?",
                options: ["1914", "1919", "1918", "1920"],
                correct: 0,
                explanation: "Según la enseñanza de JW.org, el Reino de Dios se estableció en 1914, marcando el fin de los 'siete tiempos' o 2,520 años desde 607 a.C."
            },
            {
                question: "¿Qué evento marca el INICIO oficial de la gran tribulación?",
                options: ["La proclamación de Paz y Seguridad", "La destrucción de Babilonia la Grande", "El ataque de Gog de Magog", "La Guerra del Armagedón"],
                correct: 1,
                explanation: "La destrucción de Babilonia la Grande (todas las religiones falsas) por parte de la ONU marca el inicio oficial de la gran tribulación."
            },
            {
                question: "¿Quién ejecutará la destrucción de Babilonia la Grande?",
                options: ["Los ángeles directamente", "Las Naciones Unidas con nueva autoridad", "Los gobiernos individualmente", "Los Testigos de Jehová"],
                correct: 1,
                explanation: "Según la nueva comprensión, las Naciones Unidas, después de recibir autoridad de los gobiernos, ejecutarán la destrucción de las religiones falsas."
            },
            {
                question: "¿Qué representa 'esta generación' según la enseñanza actual?",
                options: ["Una sola generación de 70-80 años", "Dos grupos de ungidos cuyas vidas coinciden", "Toda la humanidad desde 1914", "Los líderes mundiales"],
                correct: 1,
                explanation: "'Esta generación' se refiere a dos grupos de cristianos ungidos: los que vieron 1914 y los contemporáneos de algunos de ellos."
            },
            {
                question: "¿Cuál es la diferencia clave en la nueva comprensión sobre el 'pensamiento' que Jehová pone en las naciones?",
                options: ["Destruir directamente las religiones", "Entregar autoridad a la ONU", "Proclamar paz mundial", "Atacar a los ungidos"],
                correct: 1,
                explanation: "La nueva comprensión indica que Jehová pondrá en las naciones el pensamiento de entregar su autoridad a la ONU, quien entonces ejecutará la destrucción."
            }
        ];

        let currentQuizIndex = 0;

        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');

            // Update active button
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Initialize content based on tab
            if (tabName === 'timeline') {
                initializeTimeline();
            } else if (tabName === 'conceptmap') {
                initializeConceptMap();
            } else if (tabName === 'quiz') {
                initializeQuiz();
            }
        }

        function initializeTimeline() {
            const timeline = document.getElementById('mainTimeline');
            timeline.innerHTML = '';

            timelineData.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = `timeline-item ${index % 2 === 0 ? 'left' : 'right'} ${item.category}`;
                timelineItem.onclick = () => showEventDetails(item);

                timelineItem.innerHTML = `
                    <div class="timeline-content">
                        <div class="year">${item.year}</div>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="timeline-dot"></div>
                `;

                timeline.appendChild(timelineItem);
            });

            // Animate progress bar
            setTimeout(() => {
                const establishedEvents = timelineData.filter(item => item.category === 'established').length;
                const totalEvents = timelineData.length;
                const progress = (establishedEvents / totalEvents) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
            }, 500);
        }

        function initializeConceptMap() {
            const container = document.getElementById('conceptMapContainer');
            container.innerHTML = '';
            container.style.position = 'relative';
            container.style.height = '600px';

            conceptMapData.forEach(node => {
                const nodeElement = document.createElement('div');
                nodeElement.className = `concept-node ${node.type}`;
                nodeElement.style.position = 'absolute';
                nodeElement.style.left = `${node.x}%`;
                nodeElement.style.top = `${node.y}%`;
                nodeElement.style.transform = 'translate(-50%, -50%)';
                nodeElement.textContent = node.text;
                nodeElement.onclick = () => showConceptDetails(node);

                container.appendChild(nodeElement);
            });
        }

        function initializeQuiz() {
            currentQuizIndex = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const container = document.getElementById('quizContainer');
            const quiz = quizData[currentQuizIndex];

            container.innerHTML = `
                <div class="question">${quiz.question}</div>
                <div class="quiz-options">
                    ${quiz.options.map((option, index) => 
                        `<button class="quiz-option" onclick="selectAnswer(${index})">${option}</button>`
                    ).join('')}
                </div>
                <div id="quizFeedback" class="quiz-feedback"></div>
                <div style="margin-top: 20px; color: #666;">
                    Pregunta ${currentQuizIndex + 1} de ${quizData.length}
                </div>
            `;
        }

        function selectAnswer(selectedIndex) {
            const quiz = quizData[currentQuizIndex];
            const options = document.querySelectorAll('.quiz-option');
            const feedback = document.getElementById('quizFeedback');

            options.forEach((option, index) => {
                if (index === quiz.correct) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && index !== quiz.correct) {
                    option.classList.add('incorrect');
                }
                option.onclick = null; // Disable further clicks
            });

            feedback.innerHTML = `
                <h3>${selectedIndex === quiz.correct ? '¡Correcto! ✅' : 'Incorrecto ❌'}</h3>
                <p>${quiz.explanation}</p>
                <button onclick="nextQuestion()" style="margin-top: 15px; padding: 10px 20px; background: #4ecdc4; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    ${currentQuizIndex < quizData.length - 1 ? 'Siguiente Pregunta' : 'Reiniciar Quiz'}
                </button>
            `;
            feedback.className = `quiz-feedback show ${selectedIndex === quiz.correct ? 'correct' : 'incorrect'}`;
        }

        function nextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex >= quizData.length) {
                currentQuizIndex = 0;
            }
            showQuizQuestion();
        }

        function showEventDetails(event) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <h2>${event.title}</h2>
                <h3 style="color: #4ecdc4; margin-bottom: 15px;">${event.year}</h3>
                <p style="margin-bottom: 15px;"><strong>Descripción:</strong> ${event.description}</p>
                <p><strong>Detalles:</strong> ${event.details}</p>
                <div style="margin-top: 20px; padding: 15px; background: ${event.category === 'established' ? 'rgba(56, 239, 125, 0.1)' : 'rgba(255, 107, 107, 0.1)'}; border-radius: 10px;">
                    <strong>Estado:</strong> ${event.category === 'established' ? 'Acontecimiento Establecido ✅' : 'Acontecimiento Futuro ⏳'}
                </div>
            `;

            modal.style.display = 'block';
        }

        function showConceptDetails(node) {
            const details = {
                'reino': 'El establecimiento del Reino de Dios en 1914 marca el comienzo de la presencia invisible de Cristo como Rey.',
                'senal': 'La señal incluye guerras, hambre, terremotos y epidemias a escala mundial desde 1914.',
                'inspeccion': 'Período de 1914-1919 cuando Jesús inspeccionó y refinó el templo espiritual.',
                'trigo': 'En 1919 los Estudiantes de la Biblia fueron identificados como cristianos verdaderos.',
                'paz': 'Los líderes mundiales proclamarán una falsa paz que marcará el inicio del día de Jehová.',
                'onu': 'NUEVA COMPRENSIÓN: Los gobiernos entregarán súbitamente su autoridad a las Naciones Unidas.',
                'babilonia': 'La ONU destruirá todas las religiones falsas, marcando el inicio de la gran tribulación.',
                'gog': 'Coalición liderada por Rusia atacará a los siervos de Dios después de destruir las religiones.',
                'armagedon': 'Intervención divina final con Cristo y los 144,000 desde el cielo.'
            };

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <h2>${node.text}</h2>
                <p style="margin-bottom: 20px;">${details[node.id] || 'Información detallada no disponible.'}</p>
                <div style="padding: 15px; background: ${node.type === 'future' ? 'rgba(255, 107, 107, 0.1)' : 'rgba(56, 239, 125, 0.1)'}; border-radius: 10px;">
                    <strong>Tipo:</strong> ${node.type === 'future' ? 'Evento Futuro ⏳' : node.type === 'central' ? 'Evento Central 🎯' : 'Evento Establecido ✅'}
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            initializeTimeline();
        });

        // Add some interactive animations
        document.addEventListener('DOMContentLoaded', function() {
            // Animate timeline items on scroll
            const timelineItems = document.querySelectorAll('.timeline-item');
            
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animation = 'fadeIn 0.6s ease forwards';
                        entry.target.style.opacity = '1';
                    }
                });
            }, observerOptions);

            timelineItems.forEach(item => {
                item.style.opacity = '0';
                observer.observe(item);
            });
        });

        // Add interactive hover effects for concept map
        function addHoverEffects() {
            const nodes = document.querySelectorAll('.concept-node');
            nodes.forEach(node => {
                node.addEventListener('mouseenter', function() {
                    this.style.transform = 'translate(-50%, -50%) scale(1.1)';
                    this.style.zIndex = '10';
                });
                
                node.addEventListener('mouseleave', function() {
                    this.style.transform = 'translate(-50%, -50%) scale(1)';
                    this.style.zIndex = '1';
                });
            });
        }

        // Enhanced quiz functionality
        function shuffleQuiz() {
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
            currentQuizIndex = 0;
            showQuizQuestion();
        }

        // Add search functionality
        function searchEvents(query) {
            const filteredEvents = timelineData.filter(event => 
                event.title.toLowerCase().includes(query.toLowerCase()) ||
                event.description.toLowerCase().includes(query.toLowerCase()) ||
                event.year.toLowerCase().includes(query.toLowerCase())
            );
            
            displayFilteredEvents(filteredEvents);
        }

        function displayFilteredEvents(events) {
            const timeline = document.getElementById('mainTimeline');
            timeline.innerHTML = '';

            events.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = `timeline-item ${index % 2 === 0 ? 'left' : 'right'} ${item.category}`;
                timelineItem.onclick = () => showEventDetails(item);

                timelineItem.innerHTML = `
                    <div class="timeline-content">
                        <div class="year">${item.year}</div>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="timeline-dot"></div>
                `;

                timeline.appendChild(timelineItem);
            });
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Add tooltips for better user experience
        function addTooltips() {
            const elements = document.querySelectorAll('[data-tooltip]');
            elements.forEach(element => {
                element.addEventListener('mouseenter', function(e) {
                    const tooltip = document.createElement('div');
                    tooltip.className = 'tooltip';
                    tooltip.textContent = this.getAttribute('data-tooltip');
                    tooltip.style.cssText = `
                        position: absolute;
                        background: rgba(0,0,0,0.8);
                        color: white;
                        padding: 8px 12px;
                        border-radius: 4px;
                        font-size: 14px;
                        z-index: 1000;
                        pointer-events: none;
                        white-space: nowrap;
                    `;
                    document.body.appendChild(tooltip);
                    
                    const rect = this.getBoundingClientRect();
                    tooltip.style.left = rect.left + rect.width / 2 - tooltip.offsetWidth / 2 + 'px';
                    tooltip.style.top = rect.top - tooltip.offsetHeight - 8 + 'px';
                });
                
                element.addEventListener('mouseleave', function() {
                    const tooltip = document.querySelector('.tooltip');
                    if (tooltip) {
                        tooltip.remove();
                    }
                });
            });
        }
    </script>
</body>
</html>
